name: build

on:
  push:
    branches: [ main ]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

jobs:
  build:
    uses: lolaf-org/workflows/.github/workflows/maven-build.yml@v1.0.2
    with:
      # The lowest JDK that builds every module: the two Spring Boot modules compile for 17.
      java-version: '17'

  # Nothing in the reactor talks to a Docker daemon, so without this job a Dockerfile naming a jar
  # that has moved would build green and fail on an operator's first `docker run`. It pushes nothing.
  image:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-java@v6
        with:
          distribution: zulu
          java-version: '17'
          cache: maven
      - run: ./mvnw --batch-mode --no-transfer-progress install -DskipTests
      - run: docker build -f primos-witness-boot/src/main/docker/Dockerfile -t primos-witness:ci primos-witness-boot
      # The image just built, named rather than rebuilt: what is tested is the artifact.
      - run: >
          ./mvnw --batch-mode --no-transfer-progress -pl primos-witness-boot -Pdocker verify
          -Ddocker.image=primos-witness:ci
