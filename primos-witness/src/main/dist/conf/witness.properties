# The witness server's own settings. Copy this directory to /etc/primos-witness and edit.
#
# Everything here except bind.host and bind.port is re-read while the server runs, so onboarding a
# cluster never needs a restart. That matters more than it sounds: while a witness is down, every
# two-node cluster it serves is back to tolerating zero failures.
# Where to listen. Not hot-reloadable: a change here is read and ignored until a restart.
bind.host=0.0.0.0
bind.port=7420
# Where each served application's term and vote are kept, one directory each.
#
# This must be real persistent storage. Never an ephemeral container volume, and never wiped: a
# witness that forgets a vote can grant a second one in the same term and elect two leaders. For
# the same reason, never run two instances behind a virtual address or a load balancer — two
# witnesses answering for one identity is a double vote by construction.
state.directory=/var/lib/primos-witness
# Where a served application's configuration comes from.
#
# file     serves only the applications configured in applications/, and drops everything else.
#          Nothing arriving over the network changes any configuration. Choose this when automatic
#          change is not allowed here.
# cluster  an application is created when one of its nodes states its configuration, and this
#          witness then runs the intervals that node stated. A Ping or a vote request from an
#          unknown application creates nothing. Secrets still come from applications/, which
#          becomes a keyring rather than the served list: a secret cannot travel on the wire that
#          it authenticates.
#
# 'cluster' is less work and is a legitimate choice. It is also how a typo becomes a split brain:
# clusters named 'orders' and 'ordres' drop each other's datagrams, each sees the other as
# unreachable, each asks the witness, and the witness grants a vote from each bucket. That is two
# leaders out of one typo, with the cross-talk protection hiding the cause. Near-miss names are
# warned about individually, but that hazard is why 'file' is the default.
config.source=file
# How many applications 'cluster' may create, so an open witness cannot be filled
# up by whoever can reach the port.
config.cluster.limit=64
# --------------------------------------------------------------------------- keys
#
# Every key this witness holds, as secret.<name>.value, with an optional algorithm and an optional
# list of the applications it covers. Keys live here and never in an application's own file: a
# cluster that arrives over the network has no file to have had a secret set in, so keys kept per
# application could offer such a cluster only one shared key or none.
#
# THE RULE, and it is the whole of what scoping is worth: a name that any key claims is verified
# ONLY by the keys claiming it; a name nothing claims is verified by the keys that claim nothing.
# Were a claim merely a restriction, a general key beside a dedicated one would still reach the
# dedicated one's names, and the dedicated key would buy its tenant nothing.
#
# So the spectrum, along one axis and independent of config.source:
#
#   every key unscoped   any cluster may arrive, and every keyholder can speak for every other.
#                        One team, many clusters, one template.
#   some scoped          a general key for the fleet, dedicated keys for the tenants that matter.
#   every key scoped     only the named families can be served at all, and no keyholder can reach
#                        another's names. Nothing new can arrive; that is the point.
#
# applications is a comma-separated list of patterns. '*' is the only metacharacter and matches any
# run of characters, so orders-* covers a family without naming its members — which is what makes
# scoping usable when the members are not known in advance. These are NOT regular expressions: as
# one, orders-* would mean "orders followed by zero or more hyphens" and would match orders-- but
# not orders-prod. A bare '*' means the same as leaving the setting out.
#
# Two keys covering one name — overlapping patterns, or nothing claiming a name — means either key
# verifies it. That is not detected. Do not overlap.
#
# NEVER run without a key. Authentication protects replies as much as requests, and one forged vote
# grant plus a candidate's own vote is a majority in a three-voter cluster: a direct route to a
# false leader, not merely a denial of service.
#
# Rotation is not a mechanism here, it is list membership: add the new key, wait until every node
# has it, then remove the old one. Both verify while the window is open, and nothing restarts in
# lockstep.
#
# A value may be given inline, as env:NAME, as file:/path, or as base64:....
# secret.platform.value = file:/etc/primos-witness/keys/platform
# secret.platform.algorithm = HmacSHA256
#
# secret.orders.value = env:ORDERS_KEY
# secret.orders.applications = orders-*, *-test

# lan for a witness in the same datacentre, wan for one on a third network — a 50ms round trip
# makes the LAN election timeout marginal.
#
# Under config.source=cluster these are read and ignored, with a log line saying so per
# application: each cluster states its own intervals and this witness follows them.
timings.profile=lan
# If the clusters you serve run neither profile, comment timings.profile out and spell the intervals
# out instead, as whole milliseconds. Setting both a profile and an individual interval is refused:
# a profile is a set of values picked so the relationships between them hold, and half of one is not
# a profile. The two election bounds are a pair and must be set together.
# timings.heartbeat.millis=250
# timings.election.min.millis=2000
# timings.election.max.millis=4000
# timings.probe.millis=3000
# How often a node restates its intervals so a peer can report a mismatch. Never shorter than
# timings.probe.millis: the values cannot change while the process runs.
# timings.advertisement.millis=30000
# timings.failure.threshold=5
# Who voted for whom, at INFO rather than DEBUG. On by default, and worth more on a witness than
# anywhere else: this is the vote that breaks the tie, so "did the witness grant it, and to whom?"
# is the first question after a pair failed over, or failed to. Silent while leaders are healthy —
# a cluster that is not electing logs nothing here at all. Read at startup.
vote.logging=true
# Hot reload. The rescan is a safety net rather than an optimisation: file watching is inotify on
# Linux but a slow polling fallback on macOS, and does not work at all on some network
# filesystems. Hot reload that silently never fires is worse than none.
reload.debounce.millis=250
reload.rescan.seconds=30
