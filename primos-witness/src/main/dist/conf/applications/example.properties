# One file per served cluster, in applications/. The application name is the FILENAME — so this
# file serves a cluster named 'example' — which is what stops the name in the file disagreeing
# with the name the file is for. It must be printable ASCII with no spaces and at most 32 bytes,
# because it travels in a fixed field on every datagram.
#
# Adding a cluster is a file drop, not an edit to a shared file every tenant contends over, and
# each team's secret can have its own file permissions. Both of those are the point of the layout.
#
# Removing this file stops the cluster being served but leaves its state alone: a cluster that
# comes back later still needs the vote it was given remembered.

# This cluster's secret, and the one being rotated out.
#
# Rotation is two edits with a window rather than a flag day: set the new secret as current and
# the old one as previous, wait until every node in the cluster has been updated, then delete the
# previous line. Nothing is ever unable to talk, and nothing has to restart in lockstep.
#
# Inline, env:NAME, file:/path or base64:... — so this file can go into version control while the
# secret does not.
secret = file:/etc/primos-witness/secrets/example
# secret.previous = file:/etc/primos-witness/secrets/example.previous

# There is deliberately nothing here about addresses. The witness holds none: it learns each
# node's endpoint from the first datagram that passes authentication and probes it thereafter,
# which is the only thing that can work when the clusters are not known ahead of time, and which
# spares shared infrastructure a list of every tenant's node addresses.
