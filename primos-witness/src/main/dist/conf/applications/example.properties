# One file per served cluster, in applications/. The application name is the FILENAME — so this
# file serves a cluster named 'example' — which is what stops the name in the file disagreeing
# with the name the file is for. It must be printable ASCII with no spaces and at most 32 bytes,
# because it travels in a fixed field on every datagram.
#
# Adding a cluster is a file drop, not an edit to a shared file every tenant contends over.
#
# Removing this file stops the cluster being served but leaves its state alone: a cluster that
# comes back later still needs the vote it was given remembered.

# There is deliberately nothing here about keys, and setting one is refused rather than ignored.
# Keys live in witness.properties as secret.<name>.value, where an optional
# secret.<name>.applications names what each covers — see the comments there. They are witness-wide
# because a cluster that arrives over the network has no file to have had a secret set in, so keys
# kept per application could offer it only one shared key or none.
#
# A key naming this cluster is what gives it isolation: while some key claims 'example', no other
# key can speak for it.

# There is deliberately nothing here about addresses. The witness holds none: it learns each
# node's endpoint from the first datagram that passes authentication and probes it thereafter,
# which is the only thing that can work when the clusters are not known ahead of time, and which
# spares shared infrastructure a list of every tenant's node addresses.

# The intervals this cluster's nodes run, which this witness has to match. Omit them and the
# witness-wide values apply. Set them here whenever you serve clusters on different networks: one
# witness-wide value cannot match both, and the mismatched tenant will log an error about a
# disagreement nobody can resolve. Either a profile or the values, never both.
# timings.profile=wan
# timings.heartbeat.millis=250
# timings.election.min.millis=2000
# timings.election.max.millis=4000
# timings.probe.millis=3000
# timings.advertisement.millis=60000
# timings.failure.threshold=3
