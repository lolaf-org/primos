# The smallest configuration that is safe, for the compose example beside this directory.
#
# The annotated version of this file — every setting, and why each default is what it is — ships
# with the tarball, at primos-witness-cli/src/main/dist/conf/witness.properties. This is not a
# second copy of it: it is the minimum, so that `docker compose up` starts a witness that
# authenticates rather than one that answers anybody.

bind.host=0.0.0.0
bind.port=7420

# Inside the container this is the volume. Never the writable layer: a witness that forgets a vote
# across a restart can grant a second in a term it has already voted in, which elects two leaders.
state.directory=/var/lib/primos-witness

# Serve exactly what applications/ lists. `cluster` would let a cluster that knows the key create
# itself, which is the other half of the story and is in the manual.
config.source=file

timings.profile=lan

# NEVER run without a key. The witness learns its voters from traffic and cannot check a sender
# against a configured peer set the way a node does, so the tag is the whole of the gate — and one
# forged vote grant is a majority in a three-voter cluster. `env:` keeps the secret out of the file;
# `file:` and `base64:` are the other two spellings.
secret.platform.value=env:PRIMOS_WITNESS_SECRET
