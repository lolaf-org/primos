# One file per served cluster, and the FILENAME is the application name — this serves a cluster
# called 'orders'. Empty is a complete file: the witness-wide timings apply, and the witness holds
# no addresses, because it learns each node's endpoint from the first datagram that authenticates.
#
# Adding a cluster is dropping a file in here. The server re-reads the directory while it runs, so
# it needs no restart — which matters, because restarting a witness is the one genuinely risky
# operation in its lifecycle.
