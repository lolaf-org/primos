# Defaults for the witness application. Everything here can be overridden the ordinary Spring way.

# The health detail is what tells an operator which tenant is quarantined, and a quarantined tenant
# is the one thing about a witness worth waking up for. It carries application names, a served count
# and a bound address — nothing that reaching the port would not already tell whoever asked.
management.endpoint.health.show-details=always

# The probe groups are OFF, and this is the one default in this file that is a safety decision
# rather than a convenience.
#
# Spring Boot ships /actuator/health/liveness by default, and a Kubernetes user who finds it will
# point a livenessProbe at it, because that is what it is for. On a witness that is a mechanism for
# causing the outage it is watching for: restarting a witness is the one genuinely risky operation
# in its lifecycle, since while it is down every two-node cluster it serves tolerates zero failures.
# A probe that is wrong — a slow disk, a paused JVM, a network blip in the probe path — then turns a
# witness that was working into one that is gone, at the moment its clusters are least able to
# afford it.
#
# Readiness is fine and useful, and it does not need the group: point a readinessProbe at
# /actuator/health, which is UP exactly while this witness is serving. An operator who genuinely
# wants the groups can set this back to true; the point is that nobody gets a liveness endpoint by
# not thinking about it.
management.endpoint.health.probes.enabled=false

# Boot's disk-space contributor is off, and for the same reason one failed tenant does not make this
# witness DOWN: health here means "is this witness serving", and nothing else may answer that
# question on its behalf. The default watches the working directory against a 10MB threshold, which
# on a container with a read-only root filesystem and the state on a volume is neither a directory
# this process cares about nor a number that means anything about serving. A DOWN from it reads as
# "the witness is broken" and gets somebody to restart the one thing whose restart is genuinely
# risky. Disk that actually matters — the state directory — fails loudly on its own: a store that
# cannot make a vote durable quarantines its application, which is in the health detail already.
management.health.diskspace.enabled=false
