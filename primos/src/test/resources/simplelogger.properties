# The library logs a quorum summary at INFO on every start and warns about the in-memory store on
# every construction, both correctly. Across a few hundred tests that buries the test report, so
# the default is raised here. Nothing asserts on log output; where a message matters it is asserted
# through the value that produced it, such as Quorum.summary().
org.slf4j.simpleLogger.defaultLogLevel=error
